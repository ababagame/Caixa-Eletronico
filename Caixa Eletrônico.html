<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caixa Eletrônico</title>
<style>
:root{--bg:#e4e9e6;--panel:#1c2b2a;--screen:#0f1a19;--ink:#d7f2e6;--muted:#7fa396;--accent:#f2b84b;--line:#2f4442;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1110}}
:root[data-theme="dark"]{--bg:#0b1110}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);font-family:"Trebuchet MS",Verdana,sans-serif}
.atm{width:100%;max-width:440px;background:var(--panel);border-radius:18px;padding:20px;color:var(--ink)}
.screen{background:var(--screen);border:2px solid var(--line);border-radius:10px;padding:18px}
h1{font-family:Georgia,serif;font-size:1.3rem;margin:0 0 14px}
.saldo{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px;color:var(--muted)}
.saldo strong{font-size:1.5rem;color:var(--accent)}
label{display:block;margin-bottom:6px;color:var(--muted)}
input{width:100%;padding:12px;font-size:1.2rem;background:transparent;color:var(--ink);border:2px solid var(--line);border-radius:8px}
button{margin-top:12px;width:100%;padding:12px;font-size:1rem;font-weight:700;border:0;border-radius:8px;background:var(--accent);color:#1c1500;cursor:pointer}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#notas{list-style:none;margin:10px 0 0;padding:0}
</style>
</head>
<body>
<main class="atm">
  <section class="screen">
    <h1>Saque</h1>

    <div class="saldo">
      <span>Saldo disponível</span>
      <strong id="saldo">R$ 1.000,00</strong>
    </div>

    <label for="valor">Quanto você quer sacar? (R$)</label>
    <input id="valor" type="number" min="2" step="1" placeholder="280">
    <button id="sacar" type="button">Sacar</button>

    <!-- Mensagens de erro ou sucesso (JavaScript preenche aqui) -->
    <p id="msg" role="status" aria-live="polite"></p>

    <!-- Lista de notas do saque (JavaScript preenche aqui) -->
    <ul id="notas"></ul>
  </section>
</main>
</body>
</html>
